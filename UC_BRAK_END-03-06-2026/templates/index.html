```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro Realizado</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
}

.card{
    background:white;
    width:90%;
    max-width:500px;
    padding:40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
    animation:aparecer .5s ease;
}

@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.check{
    width:100px;
    height:100px;
    margin:auto;
    background:#10b981;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:50px;
    margin-bottom:20px;
}

h1{
    color:#0f172a;
    margin-bottom:10px;
}

p{
    color:#64748b;
    margin-bottom:25px;
    line-height:1.6;
}

.info{
    background:#f8fafc;
    border-radius:12px;
    padding:15px;
    text-align:left;
    margin-bottom:25px;
}

.info p{
    margin:8px 0;
    color:#334155;
}

.btn{
    display:inline-block;
    padding:14px 25px;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    background:#4338ca;
    transform:translateY(-2px);
}
</style>

</head>
<body>

<div class="card">

    <div class="check">✓</div>

    <h1>Cadastro Realizado!</h1>

    <p>
        Seu cadastro foi enviado com sucesso.
        Agora você já faz parte da DevTech.
    </p>

    <div class="info">
        <p><strong>Nome:</strong> {{ nome }}</p>
        <p><strong>E-mail:</strong> {{ email }}</p>
        <p><strong>Curso:</strong> {{ curso }}</p>
    </div>

    <a href="/" class="btn">
        Novo Cadastro
    </a>

</div>

</body>
</html>
