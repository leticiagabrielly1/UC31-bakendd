<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz da Copa do Mundo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>.inicio-card{
    max-width:800px;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.inicio-card::before{
    content:"";
    position:absolute;
    top:-120px;
    right:-120px;
    width:250px;
    height:250px;
    border-radius:50%;
    background:rgba(255,223,0,.15);
}

.inicio-card::after{
    content:"";
    position:absolute;
    bottom:-120px;
    left:-120px;
    width:250px;
    height:250px;
    border-radius:50%;
    background:rgba(0,151,57,.15);
}

.topo{
    position:relative;
    z-index:2;
}

.trofeu{
    font-size:90px;
    margin-bottom:15px;
    animation:flutuar 3s ease-in-out infinite;
}

@keyframes flutuar{
    50%{
        transform:translateY(-10px);
    }
}

.topo h1{
    font-size:3rem;
    margin-bottom:15px;
    color:#002776;
}

.topo p{
    max-width:600px;
    margin:auto;
    font-size:1.1rem;
    color:#666;
}

.estatisticas{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:35px 0;
    flex-wrap:wrap;
}

.item{
    width:150px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.item:hover{
    transform:translateY(-8px);
}

.item strong{
    display:block;
    font-size:32px;
    color:#009739;
    margin-bottom:8px;
}

.item span{
    color:#555;
    font-weight:600;
}

.campo{
    font-size:17px;
    padding:18px;
}

button{
    font-size:17px;
    letter-spacing:1px;
    font-weight:700;
}</style>
</head>
<body>

<div class="card inicio-card">

    <div class="topo">
        <div class="trofeu">🏆</div>

        <h1>Quiz da Copa do Mundo</h1>

        <p>
            Entre em campo e descubra se você realmente conhece a história
            da maior competição de futebol do planeta.
        </p>
    </div>

    <div class="estatisticas">

        <div class="item">
            <strong>5</strong>
            <span>Perguntas</span>
        </div>

        <div class="item">
            <strong>⚽</strong>
            <span>Desafio</span>
        </div>

        <div class="item">
            <strong>🏆</strong>
            <span>Campeões</span>
        </div>

    </div>

    <form action="/iniciar" method="POST">

        <input
            type="text"
            name="nome"
            placeholder="Digite seu nome para entrar em campo..."
            required
            class="campo"
        >

        <button type="submit">
            COMEÇAR AGORA →
        </button>

    </form>

</div>

</body>
</html>
